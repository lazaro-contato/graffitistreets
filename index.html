<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Graffiti Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="loading">
      <img src="/main-loading.webp" alt="" />
      <div id="loading-track"><div id="loading-bar"></div></div>
    </div>

    <div id="menu">
      <img id="menu-shark" src="/shark.webp" alt="" />

      <div class="panel">
        <section class="screen" data-screen="main">
          <h1>Graffiti Center</h1>
          <p class="kicker">// pegue sua lata</p>
          <button class="menu-item" data-action="play" type="button">
            Jogar
          </button>
          <button class="menu-item" data-action="controls" type="button">
            Controles
          </button>
        </section>

        <section class="screen" data-screen="modes" hidden>
          <p class="kicker">// como você vai andar</p>
          <div class="mode-cards" id="mode-choices"></div>
          <button class="menu-link" data-action="back" type="button">
            Voltar
          </button>
        </section>

        <section class="screen" data-screen="pause" hidden>
          <h2>Pausado</h2>
          <button class="menu-item" data-action="resume" type="button">
            Continuar jogando
          </button>
          <button class="menu-item ghost" data-action="controls" type="button">
            Controles
          </button>
          <button class="menu-item ghost" data-action="quit" type="button">
            Sair
          </button>
        </section>

        <section class="screen" data-screen="controls" hidden>
          <h2>Controles</h2>
          <div id="control-list"></div>
          <button class="menu-link" data-action="back" type="button">
            Voltar
          </button>
        </section>
      </div>
    </div>

    <div id="hud" hidden>
      <!-- Two stacked paths: a dark backing stroke under a light one, so the
           outline stays readable over both bare concrete and fresh paint. -->
      <svg id="crosshair" viewBox="-50 -50 100 100" aria-hidden="true">
        <path class="backing" vector-effect="non-scaling-stroke" />
        <path class="edge" vector-effect="non-scaling-stroke" />
      </svg>
      <div id="palette"></div>
    </div>

    <div id="inventory" hidden>
      <div class="backpack">
        <div class="flap">
          <span class="buckle"></span>
          <h2>Mochila</h2>
          <span class="buckle"></span>
        </div>

        <div id="pockets"></div>

        <p class="hint">I ou Esc para fechar</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
