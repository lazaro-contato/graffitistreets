[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vite fingerprints everything under /assets, so those URLs can never go stale
# and are safe to keep forever. Everything else in dist/ keeps its filename
# across deploys, so it is left to Netlify's ETag revalidation instead — a
# redeployed menu-bg.jpg has to actually reach people who already have it.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
